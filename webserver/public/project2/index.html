<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width,initial-scale=1.0">
        <meta name="author" content="Jomdeveloper">
        <title>LOCK IN Clock</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <!-- code for clock -->
        <div class="clock">
            <div class="number n1"><b>1</b></div>
            <div class="number n2"><b>2</b></div>
            <div class="number n3"><b>3</b></div>
            <div class="number n4"><b>4</b></div>
            <div class="number n5"><b>5</b></div>
            <div class="number n6"><b>6</b></div>
            <div class="number n7"><b>7</b></div>
            <div class="number n8"><b>8</b></div>
            <div class="number n9"><b>9</b></div>
            <div class="number n10"><b>10</b></div>
            <div class="number n11"><b>11</b></div>
            <div class="number n12"><b>12</b></div>
            
            <div class="hour-hand" id="hour-hand"></div>
            <div class="minute-hand" id="minute-hand"></div>
            <div class="second-hand" id="second-hand"></div>
            <div class="center-dot"></div>
        </div>

        <!-- code for cursor tracking eyes -->
        <div class="eyes">
            <div class="eye"><div class="ball"></div></div>
            <div class="eye"><div class="ball"></div></div>
        </div>

        <!-- LOCK IN text -->
        <h1 class="heading1"><b>LOCK IN</b></h1>
        <h3 class="heading3">I am Watching YOU...</h3>

        <button id="play" class="button">LOCK-IN</button>

        <script type="text/javascript" src="main.js"></script>
    </body>
</html>
